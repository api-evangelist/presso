name: Presso
description: >-
  Presso is a garment-care automation company (operated by parent LaundrySucks.io
  Inc.) that builds robotic, AI-driven systems for dry cleaning and laundry
  businesses. Its flagship AirTouch product is a compact, plug-and-play unit that
  runs on a standard 110V outlet and combines automatic fabric recognition,
  built-in non-toxic cleaning formulas, and smart temperature control to deliver
  same-day wash, fold, and dry cleaning under one roof. Presso positions itself
  around faster, greener, and gentler garment care without compressors, boilers,
  or skilled labor. It was surfaced as a portfolio company of Uncork Capital and
  added to the API Evangelist network for enrichment. As of this pass Presso
  publishes no public API, developer portal, SDK, or machine-readable API
  surface — it is a hardware/robotics and equipment business, not an API provider.
